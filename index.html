      background-color: var(--leli-surface);
      border-block-end: 1px solid var(--leli-border);
      font-size: 0.8125rem;

    .docs-subbar-inner {

      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .docs-breadcrumb strong {
      color: var(--leli-primary);
      font-weight: 600;
    }

    /* 3-Column Centered Documentation Grid (Sidebar + Main + On this page) */
    .docs-shell {
      max-inline-size: 1320px;
      margin-inline: auto;
      padding-inline: 1.5rem;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 200px;
      gap: 2.75rem;
      align-items: start;
    }

    @media (width < 1100px) {
      .docs-shell {
        grid-template-columns: 220px minmax(0, 1fr);
      }
      .docs-toc {
        display: none;
      }
    }

    @media (width < 820px) {
      .docs-shell {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .docs-sidebar {
        position: static;
        block-size: auto;
        border-inline-end: none;
        border-block-end: 1px solid var(--leli-border);
        padding-block: 1rem;
      }
    }

    /* Left Sidebar Navigation */
    .docs-sidebar {
      position: sticky;
      inset-block-start: 4.1rem;
      block-size: calc(100vh - 4.1rem);
      overflow-y: auto;
      padding: 1.75rem 1rem 2.5rem 0;
      border-inline-end: 1px solid var(--leli-border);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;

      font-weight: 700;

    .docs-nav-item:hover {

  <script>
    /**
     * Helper to build leliUI Interactive Example + Collision-Free Syntax Highlighted Code Card
     */
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightAttributes(attrStr) {
      return attrStr.replace(/([a-zA-Z0-9_-]+)(=)("[^"]*")/g, (_, name, eq, val) => {
        return `<span class="tok-attr">${escapeHtml(name)}</span><span class="tok-punc">${eq}</span><span class="tok-val">${escapeHtml(val)}</span>`;
      });
    }

    function highlightLine(line) {
      // Single-pass tokenizer for HTML comments, tags, and text so spans never collide
      const tokenRegex = /(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?[a-zA-Z0-9-]+(?:\s+[^&]*?)?\/?&gt;)/g;
      const escaped = escapeHtml(line);
      return escaped.replace(tokenRegex, (match, comment, tag) => {
        if (comment) {
          return `<span class="tok-cmt">${comment}</span>`;
        }
        if (tag) {
          const m = tag.match(/^(&lt;\/?)([a-zA-Z0-9-]+)([\s\S]*?)(\/?&gt;)$/);
          if (!m) return tag;
          const [, openBracket, tagName, attrs, closeBracket] = m;
          return `<span class="tok-punc">${openBracket}</span><span class="tok-tag">${tagName}</span>${highlightAttributes(attrs)}<span class="tok-punc">${closeBracket}</span>`;
        }
        return match;
      });
    }

    function highlightHtml(raw) {
      const lines = raw.split('\n');
      return lines
        .map((line, i) => `<div class="code-line"><span class="code-ln">${i + 1}</span><span>${highlightLine(line) || ' '}</span></div>`)
        .join('');
    }

    function exampleBox(previewHtml, rawCode, lang = 'html') {

    const PAGE_KEYS = Object.keys(PAGES);

    function renderPage(pageKey) {
      const page = PAGES[pageKey] || PAGES.grid;
      const idx = PAGE_KEYS.indexOf(pageKey);
      const prevKey = idx > 0 ? PAGE_KEYS[idx - 1] : null;
      const nextKey = idx < PAGE_KEYS.length - 1 ? PAGE_KEYS[idx + 1] : null;

      const main = document.getElementById('docsMain');
      main.innerHTML = `
        <header class="leli-doc-page-header">
          <span class="leli-doc-eyebrow">${page.category}</span>
          <h1 class="leli-doc-title">${page.title}</h1>
          <p class="leli-doc-lead">${page.lead}</p>
        </header>
        ${page.content}
        <nav class="docs-pager">
          <div>
            ${prevKey ? `<button class="leli-btn" onclick="navigateDoc('${prevKey}')">← ${PAGES[prevKey].title}</button>` : ''}
          </div>
          <div>
            ${nextKey ? `<button class="leli-btn" onclick="navigateDoc('${nextKey}')">${PAGES[nextKey].title} →</button>` : ''}
          </div>
        </nav>
      `;

      document.getElementById('breadcrumbText').innerHTML =
        `Docs / ${page.category} / <strong>${page.title}</strong>`;

      document.querySelectorAll('.docs-nav-item').forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.docPage === pageKey);
      });

      const topInstallLink = document.getElementById('topInstallLink');
      if (topInstallLink) {
        topInstallLink.classList.toggle('is-active', pageKey === 'getting-started');
      }
      const topAiLink = document.getElementById('topAiLink');
      if (topAiLink) {
        topAiLink.classList.toggle('is-active', pageKey === 'ai-hub');
      }

      const tocList = document.getElementById('docsTocList');
      tocList.innerHTML = '';
      main.querySelectorAll('.leli-doc-section').forEach((sec) => {
        const h2 = sec.querySelector('.leli-doc-heading');
        if (h2 && sec.id) {
          const li = document.createElement('li');
          li.innerHTML = `<a href="#${sec.id}" onclick="event.preventDefault(); document.getElementById('${sec.id}').scrollIntoView({behavior:'smooth'})">${h2.textContent}</a>`;
          tocList.appendChild(li);
        }
      });

      LeliUI.init(main);
      window.scrollTo(0, 0);
    }

    function navigateDoc(pageKey) {
      location.hash = pageKey;
    }

    window.addEventListener('hashchange', () => {
      const key = location.hash.replace('#', '') || 'grid';
      if (PAGES[key]) renderPage(key);
    });

    document.querySelectorAll('.docs-nav-item').forEach((btn) => {
      btn.addEventListener('click', () => navigateDoc(btn.dataset.docPage));
    });

    const searchInput = document.getElementById('quickSearchInput');
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = searchInput.value.trim().toLowerCase();
        const match = PAGE_KEYS.find((k) => k.includes(q) || PAGES[k].title.toLowerCase().includes(q));
        if (match) {
          navigateDoc(match);
          searchInput.blur();
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    function copyRawCode(btn) {
      const raw = decodeURIComponent(btn.dataset.raw || '');
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => (btn.textContent = old), 1200);
    }

    function copyAiSystemPrompt(btn) {
